<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="380" height="84" fill="none">
  <defs>
    <!-- Background Emblem Gradient -->
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="45%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Rich Gold Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#EAB308"/>
      <stop offset="85%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Ledger Cover Gradient -->
    <linearGradient id="logoBookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#580C1F"/>
    </linearGradient>

    <!-- Shimmering White Text -->
    <linearGradient id="logoTextWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.4"/>
    </filter>

    <filter id="goldPillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EAB308" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ========================================================= -->
  <!-- 1. Emblem Medallion (Larger 72x72 Icon) -->
  <!-- ========================================================= -->
  <g transform="translate(6, 6)" filter="url(#logoGlow)">
    <!-- Base Squircle -->
    <rect width="72" height="72" rx="18" fill="url(#logoEmblemGrad)"/>
    <rect width="69" height="69" x="1.5" y="1.5" rx="16.5" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2" stroke-opacity="0.9"/>

    <!-- Auspicious Bahi-Khata / Ledger Book Design -->
    <rect x="15" y="14" width="42" height="45" rx="5" fill="#3B0715" opacity="0.5"/>
    <rect x="13" y="12" width="42" height="45" rx="5" fill="url(#logoBookCover)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

    <!-- Spine Binding (Gold Trim) -->
    <rect x="13" y="12" width="10" height="45" rx="3" fill="url(#logoGoldGrad)"/>
    <!-- Gold Stitch Marks on Spine -->
    <circle cx="18" cy="19" r="1.3" fill="#713F12"/>
    <circle cx="18" cy="27" r="1.3" fill="#713F12"/>
    <circle cx="18" cy="35" r="1.3" fill="#713F12"/>
    <circle cx="18" cy="43" r="1.3" fill="#713F12"/>
    <circle cx="18" cy="50" r="1.3" fill="#713F12"/>

    <!-- Cream Parchment Page Edge -->
    <rect x="23" y="15" width="29" height="39" rx="3" fill="#FFFBEB"/>
    <!-- Ruled Ledger Lines on Page -->
    <line x1="26" y1="21" x2="48" y2="21" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="27" x2="48" y2="27" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="33" x2="48" y2="33" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="39" x2="44" y2="39" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rupee Sign Symbol (₹) in Golden Seal -->
    <circle cx="38" cy="35" r="9" fill="url(#logoGoldGrad)"/>
    <circle cx="38" cy="35" r="7.5" fill="#991B1B"/>
    <text x="38" y="39" font-family="'Plus Jakarta Sans', 'Mukta', sans-serif" font-weight="900" font-size="10" fill="url(#logoGoldGrad)" text-anchor="middle">₹</text>

    <!-- Auspicious Gold Bookmark Ribbon Hanging Below -->
    <path d="M29 48 L29 60 L33.5 56 L38 60 L38 48 Z" fill="url(#logoGoldGrad)"/>

    <!-- Corner Sparkle -->
    <path d="M 58 14 Q 60 17 62 17 Q 60 17 58 20 Q 56 17 54 17 Q 56 17 58 14 Z" fill="#FFFBEB"/>
  </g>

  <!-- ========================================================= -->
  <!-- 2. Typography: "लेखा जोखा" & "PRO ENTERPRISE" -->
  <!-- ========================================================= -->
  <g transform="translate(94, 8)">
    <!-- Primary Devanagari Brand Headline -->
    <text x="0" y="38" font-family="'Mukta', 'Rozha One', 'Nirmala UI', sans-serif" font-size="36" font-weight="800" fill="url(#logoTextWhite)" letter-spacing="0.5">
      लेखा जोखा
    </text>

    <!-- PRO ENTERPRISE Golden Badge Pill -->
    <g transform="translate(162, 14)" filter="url(#goldPillGlow)">
      <rect width="112" height="25" rx="7" fill="#E11D48" stroke="url(#logoGoldGrad)" stroke-width="1.5"/>
      <text x="56" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
        PRO ★ VIP
      </text>
    </g>

    <!-- Subtitle: English & Hindi Micro-Tagline -->
    <g transform="translate(1, 56)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FACC15" letter-spacing="1.5">
        SMART GST BILLING &amp; ACCOUNTING
      </text>
      <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
        MADE FOR 10+ LAKH INDIAN TRADERS &amp; DISTRIBUTORS
      </text>
    </g>
  </g>
</svg>
