# ==============================================================================
# Lekha Jokha - Render Infrastructure-as-Code Blueprint
# Deploy Web Service + PostgreSQL with automated migrations and health checks
# ==============================================================================

databases:
  - name: lekhajokha-postgres
    databaseName: lekhajokha_db
    user: lekhajokha_user
    region: singapore # Closest available Render region to India for minimum latency
    plan: standard # Or free / starter depending on tier
    ipAllowList: [] # Allows connections from Render services

services:
  - type: web
    name: lekhajokha-app
    runtime: node
    region: singapore
    plan: starter
    rootDir: vyapar-app
    buildCommand: npm install
    startCommand: npm run db:migrate && node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: STRICT_PG
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lekhajokha-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_BUSINESSES_PER_OWNER
        value: "5"
      - key: RATE_LIMIT_MAX
        value: "2000"
